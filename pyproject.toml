[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-enhanced-caption"
version = "0.1.0"
description = "A multi-modal RAG enhancement toolkit featuring surgical Markdown context extraction, VLM-powered image/table captioning, and semantic chunking."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "ZHOU shujian", email = "flyinghenanese@gmail.com"},
]
keywords = [
    "rag",
    "llm",
    "vlm",
    "markdown",
    "semantic-chunking",
    "retrieval-augmented-generation",
    "document-processing"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "httpx>=0.28.1",
    "markdown-it-py>=3.0.0",
    "loguru>=0.7.0",
    "mdit-py-plugins>=0.5.0",
    "beautifulsoup4>=4.14.3",
    "nltk>=3.9.4",
    "scikit-learn>=1.7.2",
    "numpy>=2.2.6",
    "requests>=2.33.1",
    "python-dotenv>=1.2.2",
]

[project.urls]
Homepage = "https://github.com/Flying-Henanese/rag_enhanced_caption"
Repository = "https://github.com/Flying-Henanese/rag_enhanced_caption.git"
Issues = "https://github.com/Flying-Henanese/rag_enhanced_caption/issues"

[project.optional-dependencies]
local = [
    "numpy>=2.2.6",
    "sentence-transformers>=5.4.1",
]
integrations = [
    "langchain-core",
    "llama-index-core",
    "llama-index-embeddings-openai>=0.6.0",
]
demo = [
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "python-multipart>=0.0.27",
    "llama-index-core>=0.14.21",
    "llama-index-postprocessor-siliconflow-rerank>=0.4.0",
    "llama-index-embeddings-openai>=0.6.0",
]
dev = [
    "pytest",
    "python-dotenv",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_enhanced_caption"]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[dependency-groups]
dev = [
    "numpy>=2.2.6",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.15.12",
]
