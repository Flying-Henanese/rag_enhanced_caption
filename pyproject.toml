[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-enhanced-caption"
version = "0.1.0"
description = "A multi-modal RAG enhancement toolkit featuring surgical Markdown context extraction, VLM-powered image/table captioning, and semantic chunking."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "ZHOU shujian", email = "flyinghenanese@gmail.com"},
]
dependencies = [
    "httpx>=0.28.1",
    "markdown-it-py>=3.0.0",
    "loguru>=0.7.0",
    "mdit-py-plugins>=0.5.0",
    "beautifulsoup4>=4.14.3",
    "nltk>=3.9.4",
    "scikit-learn>=1.7.2",
    "pytest>=9.0.3",
]

[project.optional-dependencies]
local = [
    "numpy>=2.2.6",
    "sentence-transformers>=5.4.1",
]
dev = [
    "pytest",
    "python-dotenv",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_enhanced_caption"]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[dependency-groups]
dev = [
    "numpy>=2.2.6",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
]
