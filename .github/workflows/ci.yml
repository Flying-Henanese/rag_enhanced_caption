name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    # 强制所有 Javascript Actions 使用 Node.js 24 运行时，以消除弃用警告
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VLM_API_KEY: ${{ secrets.VLM_API_KEY }}
      VLM_ENDPOINT: ${{ vars.VLM_ENDPOINT }}
      VLM_MODEL_NAME: ${{ vars.VLM_MODEL_NAME }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      EMBEDDING_ENDPOINT: ${{ vars.EMBEDDING_ENDPOINT }}
      EMBEDDING_MODEL_NAME: ${{ vars.EMBEDDING_MODEL_NAME }}
      RERANK_API_KEY: ${{ secrets.RERANK_API_KEY }}
      RERANK_ENDPOINT: ${{ vars.RERANK_ENDPOINT }}
      RERANK_MODEL_NAME: ${{ vars.RERANK_MODEL_NAME }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install the project and dependencies
        run: uv sync --all-extras --dev

      - name: Lint and Format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run pytest
        run: uv run pytest tests/
