name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VLM_API_KEY: ${{ secrets.VLM_API_KEY }}
      VLM_ENDPOINT: ${{ vars.VLM_ENDPOINT }}
      VLM_MODEL_NAME: ${{ vars.VLM_MODEL_NAME }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      EMBEDDING_ENDPOINT: ${{ vars.EMBEDDING_ENDPOINT }}
      EMBEDDING_MODEL_NAME: ${{ vars.EMBEDDING_MODEL_NAME }}
      RERANK_API_KEY: ${{ secrets.RERANK_API_KEY }}
      RERANK_ENDPOINT: ${{ vars.RERANK_ENDPOINT }}
      RERANK_MODEL_NAME: ${{ vars.RERANK_MODEL_NAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint and Format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        run: uv run pytest tests/

      - name: Build package
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 如果你想发布到 PyPI，取消下面的注释并配置仓库 Secret: PYPI_TOKEN
      # - name: Publish to PyPI
      #   if: startsWith(github.ref, 'refs/tags/')
      #   run: uv publish
      #   env:
      #     UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
